<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Animated Glow Effect -->
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.1" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Dynamic Pulse Animations -->
    <style>
      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.5; }
        50% { transform: translate(40px, 20px) scale(1.15); opacity: 0.8; }
        100% { transform: translate(0px, 0px) scale(1); opacity: 0.5; }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.4; }
        50% { transform: translate(-30px, -25px) scale(1.2); opacity: 0.7; }
        100% { transform: translate(0px, 0px) scale(1); opacity: 0.4; }
      }
      @keyframes pulseGrid {
        0% { opacity: 0.15; }
        50% { opacity: 0.35; }
        100% { opacity: 0.15; }
      }
      @keyframes streamLine {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      .orb-1 { animation: floatOrb1 8s ease-in-out infinite; }
      .orb-2 { animation: floatOrb2 10s ease-in-out infinite; }
      .grid-bg { animation: pulseGrid 6s ease-in-out infinite; }
      .stream-path {
        stroke-dasharray: 200;
        animation: streamLine 4s linear infinite;
      }
      .title-text {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 42px;
      }
      .subtitle-text {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1000" height="300" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2" />

  <!-- Animated Dynamic Background Glowing Orbs (Behind Content) -->
  <g filter="blur(40px)">
    <circle class="orb-1" cx="200" cy="100" r="120" fill="#0284c7" />
    <circle class="orb-2" cx="800" cy="200" r="140" fill="#7e22ce" />
    <circle class="orb-1" cx="500" cy="250" r="90" fill="#2563eb" />
  </g>

  <!-- Animated Grid Overlay -->
  <g class="grid-bg" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.2">
    <path d="M0 50 H1000 M0 100 H1000 M0 150 H1000 M0 200 H1000 M0 250 H1000" />
    <path d="M100 0 V300 M200 0 V300 M300 0 V300 M400 0 V300 M500 0 V300 M600 0 V300 M700 0 V300 M800 0 V300 M900 0 V300" />
  </g>

  <!-- Animated Futuristic Flow Lines -->
  <path class="stream-path" d="M 50,230 Q 250,150 450,230 T 950,180" fill="none" stroke="url(#text-grad)" stroke-width="2" stroke-opacity="0.6" />

  <!-- Foreground Content Card (Ensures text stays strictly crisp and foregrounded) -->
  <rect x="40" y="35" width="920" height="230" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />

  <!-- Foreground Text Content -->
  <!-- Main Title -->
  <g transform="translate(70, 105)">
    <!-- Shadow for ultra crispness -->
    <text class="title-text" x="2" y="2" fill="#030712" opacity="0.8">Awesome Premium AI Assistant</text>
    <text class="title-text" x="0" y="0" fill="url(#text-grad)">Awesome Premium AI Assistant</text>
  </g>

  <!-- Subtitle -->
  <text class="subtitle-text" x="70" y="150">
    Curated SaaS Products, Frontier AI Copilots &amp; Open-Source Local Assistants
  </text>

  <!-- Interactive Tag Pills in Foreground -->
  <g transform="translate(70, 190)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="32" rx="16" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1" />
    <text class="pill-text" x="18" y="21">🚀 SaaS Platforms</text>

    <!-- Pill 2 -->
    <rect x="175" y="0" width="180" height="32" rx="16" fill="#581c87" fill-opacity="0.4" stroke="#c084fc" stroke-width="1" />
    <text class="pill-text" x="193" y="21">💻 Open-Source LLMs</text>

    <!-- Pill 3 -->
    <rect x="370" y="0" width="165" height="32" rx="16" fill="#1e3a8a" fill-opacity="0.4" stroke="#60a5fa" stroke-width="1" />
    <text class="pill-text" x="388" y="21">🤖 Autonomous Agents</text>

    <!-- Pill 4 -->
    <rect x="550" y="0" width="145" height="32" rx="16" fill="#065f46" fill-opacity="0.4" stroke="#34d399" stroke-width="1" />
    <text class="pill-text" x="568" y="21">🔒 Local Privacy AI</text>
  </g>
</svg>
